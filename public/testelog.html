<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/teste.css">
    <title>Login</title>
</head>
<body>
    <div class="fundo_login">
    <div class="cadastro-box">

        <div class="logo">
            <a href="teste.html"><div class="logo-icon" ></div></a>
            <h1>Aero<span>Guard</span></h1>
        </div>

        <form>

            <div class="campo">
                <label for="codigo"> &nbsp; Código da empresa</label>
                <input 
                    type="text" 
                    id="codigo" 
                    placeholder="Digite o código da empresa"
                >
            </div>

            <div class="campo">
                <label for="nome"> &nbsp; Nome</label>
                <input 
                    type="text" 
                    id="nome" 
                    placeholder="Digite seu nome"
                >
            </div>

            <div class="campo">
                <label for="email"> &nbsp; Email</label>
                <input 
                    type="email" 
                    id="email" 
                    placeholder="Digite seu email"
                >
            </div>

            <div class="campo">
                <label for="senha"> &nbsp; Senha</label>
                <input 
                    type="password" 
                    id="senha" 
                    placeholder="Digite sua senha"
                >
            </div>

            <div class="campo">
                <label for="confirmar">&nbsp; Confirmação de senha</label>
                <input 
                    type="password" 
                    id="confirmar" 
                    placeholder="Confirme sua senha"
                >
            </div>

            <div class="login">
                Já tem conta?
                <a href="#">Faça login</a>
            </div>

            <button class="bt_cadastrar">Cadastrar-se</button>

    </form></div>

</div>
</body>
</html>
