<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Visão Geral | AeroGuard</title>
  <link rel="icon" href="assets/brand/aeroguard-vertical.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/visao-geral.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/visao-geral.js" defer></script>
</head>

<body class="dashboard-page">
  <svg xmlns="http://www.w3.org/2000/svg" class="icon-library" aria-hidden="true">
    <symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01M11 6.5h6M11 17.5h6"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.01A1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.01A1.65 1.65 0 0 0 20.91 10H21a2 2 0 1 1 0 4h-.09A1.65 1.65 0 0 0 19.4 15Z"/></symbol>
    <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 9h6v6H9zM9 1v4m6-4v4M9 19v4m6 0v4M1 9h4m-4 6h4m14-6h4m-4 6h4"/></symbol>
    <symbol id="i-user-plus" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/></symbol>
  </svg>
  <div class="dashboard-layout">
    <aside class="dash__sidebar">
      <div class="sidebar__top">
        <a class="dashboard-brand" href="index.html"><img src="assets/brand/aeroguard-vertical.svg" alt="AeroGuard" width="887" height="887" /></a><span class="dash__espacador"></span>
        <nav class="dashboard-nav" aria-label="Navegação da dashboard">
          <a href="visao-geral.html" class="dash__nav-item is-active" aria-current="page"><svg class="icon icon--20" aria-hidden="true"><use href="#i-server"/></svg><span>Visão Geral</span></a>
          <a href="maquinas.html" class="dash__nav-item"><svg class="icon icon--20" aria-hidden="true"><use href="#i-settings"/></svg><span>Máquinas</span></a>
          <a href="cpu.html" class="dash__nav-item"><svg class="icon icon--20" aria-hidden="true"><use href="#i-cpu"/></svg><span>Análise de CPU</span></a>
          <a href="cadastro-funcionarios.html" class="dash__nav-item" data-admin-only hidden><svg class="icon icon--20" aria-hidden="true"><use href="#i-user-plus"/></svg><span>Usuários</span></a>
        </nav>
      </div>
      <div class="sidebar__bottom">
        <span class="dash__espacador"></span>
        <div class="sidebar-user">
          <div class="sidebar-user__info">
            <span class="sidebar-user__role">Logado como:</span><span class="sidebar-user__name">Usuário</span>
          </div>
        </div>
        <a href="index.html" class="btn btn--secondary btn--logout">Sair</a>
        <p>© AeroGuard - 2026</p>
      </div>
    </aside>
    <main class="dashboard-main">
      <header class="dashboard-header">
        <div class="dashboard-header__host">
          <p class="mono-label">Histórico</p>
          <h1>Visão Geral</h1>
          <p>Máximos históricos e séries de monitoramento.</p>
        </div>
      </header>
      <section class="dashboard-kpis">
        <dl class="kpis" id="maximos">
          <div class="kpi">
            <dt class="kpi__label">CPU</dt>
            <dd class="kpi__value">—</dd>
            <dd class="kpi__delta">Sem dados</dd>
          </div>
          <div class="kpi">
            <dt class="kpi__label">Memória</dt>
            <dd class="kpi__value">—</dd>
            <dd class="kpi__delta">Sem dados</dd>
          </div>
          <div class="kpi">
            <dt class="kpi__label">Disco</dt>
            <dd class="kpi__value">—</dd>
            <dd class="kpi__delta">Sem dados</dd>
          </div>
          <div class="kpi">
            <dt class="kpi__label">Rede</dt>
            <dd class="kpi__value">—</dd>
            <dd class="kpi__delta">Sem dados</dd>
          </div>
        </dl>
      </section>
      <div class="dashboard-grid overview-grid">
        <section class="panel panel--wide">
          <div class="panel__head">
            <h2 class="panel__title">CPU</h2>
          </div>
          <div class="timeseries"><canvas id="chart-cpu"></canvas></div>
        </section>
        <section class="panel">
          <div class="panel__head">
            <h2 class="panel__title">Memória</h2>
          </div>
          <div class="timeseries"><canvas id="chart-memoria"></canvas></div>
        </section>
      </div>
      <section class="panel overview-disk">
        <div class="panel__head">
          <h2 class="panel__title">Disco</h2>
        </div>
        <div class="timeseries"><canvas id="chart-disco"></canvas></div>
        <p class="panel__meta" id="feedback"></p>
      </section>
    </main>
  </div>
</body>

</html>
